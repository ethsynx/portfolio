# Publica la web en GitHub Pages cada vez que subes cambios a la rama main.
# Puedes ver cómo va en la pestaña «Actions» del repositorio.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Compilar
        run: |
          # usuario.github.io se publica en la raíz; cualquier otro repositorio, en /<nombre>/
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE_PATH="/"; else BASE_PATH="/$REPO/"; fi
          BASE_PATH="$BASE_PATH" npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
